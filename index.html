<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloc de Notas Adhesivas</title>
    <!-- Configuración para PWA (Instalable y Offline) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f39c12">
    <!-- Fuente estilo manuscrita/cursiva desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1e1e2f;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 2.2rem;
            color: #f39c12;
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        button, select {
            padding: 14px 22px;
            font-size: 1.1rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s ease;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-add {
            background-color: #2ecc71;
            color: white;
        }

        .color-picker {
            padding: 12px;
            background: #2c2c3e;
            color: #fff;
            border-radius: 12px;
        }

        /* Contenedor de las notas (Grid flexible) */
        .notes-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Estilo de la Notita Adhesiva (Post-it) */
        .note {
            position: relative;
            min-height: 260px;
            padding: 20px;
            padding-top: 35px; /* Espacio para la simulación del adhesivo superior */
            box-shadow: 3px 5px 15px rgba(0,0,0,0.4);
            border-radius: 2px 2px 10px 10px;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease;
        }

        .note:hover {
            transform: translateY(-5px);
        }

        /* Simulación de la sombra superior del adhesivo */
        .note::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 15px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 2px 2px 0 0;
        }

        /* Botón de borrar nota (X) */
        .note .delete-btn {
            position: absolute;
            top: 5px;
            right: 8px;
            background: transparent;
            border: none;
            color: #333;
            font-size: 1.4rem;
            cursor: pointer;
            box-shadow: none;
            padding: 0;
            opacity: 0.6;
        }

        .note .delete-btn:hover {
            opacity: 1;
            color: #c0392b;
        }

        /* Área de escritura con tipografía Cursiva / Manuscrita tipo libreta */
        .note textarea {
            width: 100%;
            height: 190px;
            background: transparent;
            border: none;
            resize: none;
            font-family: 'Caveat', cursive, sans-serif;
            font-size: 1.8rem;
            line-height: 1.3;
            color: #2c3e50;
            outline: none;
        }

        /* Paleta de colores para los Post-its */
        .color-yellow { background-color: #fff9c4; }
        .color-blue { background-color: #b3e5fc; }
        .color-green { background-color: #c8e6c9; }
        .color-pink { background-color: #f8bbd0; }
        .color-purple { background-color: #e1bee7; }
    </style>
</head>
<body>

    <header>
        <h1>📌 Mis Apuntes Adhesivos</h1>
        <p>Escribe tus notas con estilo libreta y guárdalas automáticamente.</p>
    </header>

    <div class="controls">
        <select id="noteColor" class="color-picker">
            <option value="color-yellow">Amarillo Clásico</option>
            <option value="color-blue">Celeste Cielo</option>
            <option value="color-green">Verde Menta</option>
            <option value="color-pink">Rosa Pastel</option>
            <option value="color-purple">Violeta Suave</option>
        </select>
        <button class="btn-add" onclick="createNote()">+ Nueva Notita</button>
    </div>

    <!-- Contenedor dinámico de notas -->
    <div class="notes-container" id="notesContainer"></div>

    <script>
        document.addEventListener('DOMContentLoaded', loadNotes);

        function getStoredNotes() {
            return JSON.parse(localStorage.getItem('sticky_notes') || '[]');
        }

        function saveNotesToStorage(notes) {
            localStorage.setItem('sticky_notes', JSON.stringify(notes));
        }

        function createNote(text = '', color = null) {
            const container = document.getElementById('notesContainer');
            const selectedColor = color || document.getElementById('noteColor').value;

            const noteEl = document.createElement('div');
            noteEl.classList.add('note', selectedColor);

            noteEl.innerHTML = `
                <button class="delete-btn" onclick="deleteNote(this)">&times;</button>
                <textarea placeholder="Escribe tu apunte aquí...">${text}</textarea>
            `;

            const textarea = noteEl.querySelector('textarea');
            textarea.addEventListener('input', updateNotesStorage);

            container.appendChild(noteEl);
            updateNotesStorage();
        }

        function deleteNote(btn) {
            const noteEl = btn.parentElement;
            noteEl.remove();
            updateNotesStorage();
        }

        function updateNotesStorage() {
            const noteElements = document.querySelectorAll('.note');
            const notes = [];

            noteElements.forEach(noteEl => {
                const text = noteEl.querySelector('textarea').value;
                const colorClass = Array.from(noteEl.classList).find(c => c.startsWith('color-'));
                notes.push({ text, color: colorClass });
            });

            saveNotesToStorage(notes);
        }

        function loadNotes() {
            const notes = getStoredNotes();
            if (notes.length === 0) {
                createNote('¡Bienvenido a tus notas adhesivas! Escribe lo que quieras.', 'color-yellow');
            } else {
                notes.forEach(note => {
                    createNote(note.text, note.color);
                });
            }
        }

        // Registro del Service Worker para funcionamiento sin conexión (Offline)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registrado con éxito:', reg.scope))
                    .catch(err => console.log('Error al registrar el Service Worker:', err));
            });
        }
    </script>
</body>
</html>
